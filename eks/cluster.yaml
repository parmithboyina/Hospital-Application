apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hospital-eks
  region: us-east-2
  version: "1.30"

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-workers
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20

addons:
  - name: aws-ebs-csi-driver
